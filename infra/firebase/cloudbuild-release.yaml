# Triggered only by pushes to main (including merged PRs).
# Manual verification uses _DEPLOY=false; it builds/tests without publishing.
steps:
  - id: verify-ci-source
    waitFor: ['-']
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: python3
    args: ['infra/firebase/verified_source.py']

  - id: test-database
    waitFor: ['verify-ci-source']
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['infra/firebase/prepare-test-database.sh']

  - id: restore-frontend-dependencies
    waitFor: ['verify-ci-source']
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: python3
    args: ['infra/firebase/dependency_cache.py', 'restore']

  - id: verify-and-build-frontend
    waitFor: ['test-database', 'restore-frontend-dependencies']
    name: node:22-bookworm
    entrypoint: bash
    env:
      - CI=true
      - DATABASE_URL=postgresql://postgres:ci-only-password@siskop-ci-postgres:5432/siskop_ci_test
      - JWT_SECRET=cloud-build-test-only
      - JWT_REFRESH_SECRET=cloud-build-refresh-test-only
      - PUPPETEER_SKIP_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    args: ['infra/firebase/verify-release.sh']

  - id: build-backend
    waitFor: ['-']
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['infra/firebase/build-backend.sh', 'build']

  - id: build-central-gateway
    waitFor: ['-']
    name: gcr.io/cloud-builders/docker
    args: [build, --pull, -t, 'asia-southeast2-docker.pkg.dev/siskop-d0f8c/siskop-staging/central-gateway:$BUILD_ID', infra/central-gateway]

  - id: push-backend
    waitFor: ['verify-and-build-frontend', 'build-backend', 'build-central-gateway']
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['infra/firebase/build-backend.sh', 'push']

  - id: push-central-gateway
    waitFor: ['push-backend']
    name: gcr.io/cloud-builders/docker
    args: [push, 'asia-southeast2-docker.pkg.dev/siskop-d0f8c/siskop-staging/central-gateway:$BUILD_ID']

  - id: acquire-release
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args: ['infra/firebase/run-release.sh', 'acquire']

  - id: migrate-and-deploy-backend
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args: ['infra/firebase/run-release.sh', 'backend']

  - id: prepare-tenant-hosting
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args: ['infra/firebase/run-release.sh', 'prepare-tenant']

  - id: publish-tenant-hosting
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args: ['infra/firebase/run-release.sh', 'publish-tenant']

  # Registration redirects need a ready tenant gateway before central publish.
  - id: publish-frontend
    name: us-docker.pkg.dev/firebase-cli/us/firebase:15.12.0
    entrypoint: sh
    args:
      - -ceu
      - |
        if [ ! -f .release/state.json ]; then exit 0; fi
        firebase deploy --only hosting --project siskop-d0f8c --non-interactive \
          --message "main@$COMMIT_SHA (Cloud Build $BUILD_ID)"

  - id: verify-and-finish-release
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args: ['infra/firebase/run-release.sh', 'finish']

  # Optional upload overlaps image publication/deployment, rather than gating it.
  - id: save-frontend-dependencies
    waitFor: ['verify-and-build-frontend']
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: python3
    args: ['infra/firebase/dependency_cache.py', 'save']

images: ['${_IMAGE}:$BUILD_ID', 'asia-southeast2-docker.pkg.dev/siskop-d0f8c/siskop-staging/central-gateway:$BUILD_ID']
timeout: 3600s
substitutions:
  _DEPLOY: 'true'
  _VERIFICATION: reuse-ci
  # The controlled cutover holds the live trigger until the new source is ready.
  _BACKEND: contabo
  # Wildcard hosting is live. Staff login and paid registrations must use it.
  _TENANT_HOSTING: 'true'
  _TENANT_RENAME_ENABLED: 'false'
  _TENANT_LOGIN_SELECTION_ENABLED: 'true'
  _TENANT_SWITCHING_ENABLED: 'false'
  _TENANT_SMOKE_SLUG: 'siskop-ci-smoke'
  _IMAGE: asia-southeast2-docker.pkg.dev/siskop-d0f8c/siskop-staging/api
options:
  logging: CLOUD_LOGGING_ONLY
  env:
    - RELEASE_DEPLOY=${_DEPLOY}
    - RELEASE_VERIFICATION=${_VERIFICATION}
    - RELEASE_BACKEND=${_BACKEND}
    - RELEASE_BUILD_ID=$BUILD_ID
    - RELEASE_COMMIT=$COMMIT_SHA
    - RELEASE_BRANCH=$BRANCH_NAME
    - RELEASE_IMAGE=${_IMAGE}:$BUILD_ID
    - RELEASE_TENANT_HOSTING=${_TENANT_HOSTING}
    - RELEASE_TENANT_RENAME_ENABLED=${_TENANT_RENAME_ENABLED}
    - RELEASE_TENANT_LOGIN_SELECTION_ENABLED=${_TENANT_LOGIN_SELECTION_ENABLED}
    - RELEASE_TENANT_SWITCHING_ENABLED=${_TENANT_SWITCHING_ENABLED}
    - RELEASE_TENANT_SMOKE_SLUG=${_TENANT_SMOKE_SLUG}
serviceAccount: projects/siskop-d0f8c/serviceAccounts/siskop-cloud-build@siskop-d0f8c.iam.gserviceaccount.com
