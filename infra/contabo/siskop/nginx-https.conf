server {
    listen 80;
    listen [::]:80;
    server_name siskop-api.inovasijayakarsa.id;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/siskop-acme;
        try_files $uri =404;
    }
    location / { return 308 https://siskop-api.inovasijayakarsa.id:18443$request_uri; }
}

server {
    # Dedicated SISKOP port: preserve Cloudflare-only access to host 80/443.
    listen 18443 ssl;
    listen [::]:18443 ssl;
    server_name siskop-api.inovasijayakarsa.id;
    ssl_certificate /srv/siskop/staging/letsencrypt/live/siskop-api.inovasijayakarsa.id/fullchain.pem;
    ssl_certificate_key /srv/siskop/staging/letsencrypt/live/siskop-api.inovasijayakarsa.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/siskop-api-error.log warn;
    client_max_body_size 3m;
    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host siskop-api.inovasijayakarsa.id;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_next_upstream off;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "private, no-store" always;
    }
}
