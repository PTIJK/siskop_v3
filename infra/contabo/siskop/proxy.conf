worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    include /etc/siskop-state/access.conf;
    limit_conn_zone $server_name zone=siskop_connections:1m;
    limit_req_zone $binary_remote_addr zone=siskop_requests:1m rate=100r/s;
    server {
        listen 8443 ssl;
        server_name siskop-api.inovasijayakarsa.id;
        if ($siskop_maintenance) { return 503; }
        ssl_certificate /etc/siskop-tls/bundle.pem;
        ssl_certificate_key /etc/siskop-tls/bundle.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SISKOP_SSL:1m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        client_max_body_size 3m;
        limit_conn siskop_connections 256;
        limit_req zone=siskop_requests burst=100 nodelay;
        include /etc/siskop-state/upstream.conf;
        proxy_http_version 1.1;
        proxy_set_header Host siskop-api.inovasijayakarsa.id;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_next_upstream off;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "private, no-store" always;
        location /api/scheduler/ {
            proxy_read_timeout 330s;
            proxy_pass http://$siskop_upstream;
        }
        location / {
            proxy_pass http://$siskop_upstream;
        }
    }
}
