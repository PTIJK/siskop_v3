services:
  postgres:
    image: postgres:15-alpine
    container_name: siskop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: siskop_dev
    ports:
      # Host 5433, not 5432: this machine runs an unrelated native Postgres
      # service on 5432. Keep DATABASE_URL in apps/backend/.env in sync.
      - "5433:5432"
    volumes:
      - siskop-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  siskop-pgdata:
