<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SISKOP v3 Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* ===== Tokens (HSL, shadcn-compatible names) ===== */
:root{
  --background:220 20% 98%; --foreground:224 30% 11%;
  --card:0 0% 100%; --card-foreground:224 30% 11%;
  --muted:220 16% 95%; --muted-foreground:220 10% 38%;
  --accent:233 80% 96%; --accent-foreground:233 55% 32%;
  --brand:233 62% 50%;
  --primary:224 30% 12%; --primary-foreground:0 0% 100%;
  --border:220 14% 90%; --input:220 12% 78%; --ring:233 62% 50%;
  --destructive:4 66% 42%; --success:150 62% 26%; --warning:34 92% 30%; --info:212 62% 36%;
  --hero:0 0% 100%; --hero-foreground:224 30% 11%; --hero-muted:220 10% 40%; --hero-line:220 14% 91%;
  --sidebar:0 0% 100%; --sidebar-foreground:224 30% 14%; --sidebar-active:220 20% 96%;
  --radius:14px;
  --chart-1:224 30% 12%; --chart-2:30 85% 38%;
}
.dark{
  --background:224 22% 7%; --foreground:220 20% 94%;
  --card:224 20% 10%; --card-foreground:220 20% 94%;
  --muted:224 16% 15%; --muted-foreground:220 12% 68%;
  --accent:233 40% 20%; --accent-foreground:233 85% 88%;
  --brand:233 85% 74%;
  --primary:0 0% 96%; --primary-foreground:224 30% 10%;
  --border:224 14% 19%; --input:224 12% 32%; --ring:233 85% 74%;
  --destructive:4 80% 68%; --success:150 55% 60%; --warning:38 90% 62%; --info:208 80% 72%;
  --hero:224 20% 10%; --hero-foreground:220 20% 94%; --hero-muted:220 12% 68%; --hero-line:224 14% 19%;
  --sidebar:224 22% 8%; --sidebar-foreground:220 18% 90%; --sidebar-active:224 18% 14%;
  --chart-1:233 85% 78%; --chart-2:36 90% 62%;
}
*{box-sizing:border-box;margin:0}
html{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
body{background:hsl(var(--background));color:hsl(var(--foreground));min-height:100vh;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid hsl(var(--ring));outline-offset:2px;border-radius:8px}
.num,.money{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
.ic{width:18px;height:18px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:hsl(var(--muted-foreground))}
.right,.tbl th.right{text-align:right}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}

/* ===== Shell ===== */
#app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
#app.rail{grid-template-columns:72px 1fr}
.sb{background:hsl(var(--sidebar));color:hsl(var(--sidebar-foreground));border-right:1px solid hsl(var(--border));padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30;transition:transform .2s}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.logo{width:30px;height:30px;flex:none}
.sb-g{margin-top:12px;padding:0 10px 4px;font-size:12px;font-weight:700;color:hsl(var(--muted-foreground))}
.nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;font-weight:600;font-size:13.5px;color:inherit;width:100%;text-align:left;position:relative}
.nav:hover{background:hsl(var(--sidebar-active)/.7)}
.nav[aria-current=page]{background:hsl(var(--sidebar-active));box-shadow:inset 3px 0 0 hsl(var(--primary))}
.nav .lk{margin-left:auto;opacity:.65}
.nav .ic{opacity:.85}
.tenant{margin-top:auto;border:1px solid hsl(var(--border));border-radius:12px;padding:12px;background:hsl(var(--card));font-size:12.5px}
.tenant b{display:block;font-size:13.5px}
.meter{height:6px;border-radius:9px;background:hsl(var(--muted));overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:9px;background:hsl(var(--success))}
.meter.warn i{background:hsl(var(--warning))}
.meter.full i{background:hsl(var(--destructive))}
.rail .nav span,.rail .sb-g,.rail .brand span,.rail .tenant,.rail .nav .lk{display:none}
.rail .nav{justify-content:center}
.rail .sb-g{display:block;height:1px;background:hsl(var(--border));margin:10px 6px;padding:0;font-size:0}

.main{min-width:0;display:flex;flex-direction:column}
.top{height:60px;display:flex;align-items:center;gap:10px;padding:0 24px;border-bottom:1px solid hsl(var(--border));background:hsl(var(--background)/.9);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20}
.search{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border:1px solid hsl(var(--input));border-radius:999px;background:hsl(var(--card));color:hsl(var(--muted-foreground));width:min(420px,100%);font-weight:500}
.search:hover{border-color:hsl(var(--ring))}
kbd{font:600 11px 'Manrope',sans-serif;border:1px solid hsl(var(--input));border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:hsl(var(--muted));color:hsl(var(--muted-foreground))}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid hsl(var(--border));background:hsl(var(--card));position:relative}
.iconbtn:hover{background:hsl(var(--muted))}
.dot{position:absolute;top:6px;right:7px;min-width:16px;height:16px;border-radius:9px;background:hsl(var(--destructive));color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid hsl(var(--background))}
.avatar{width:34px;height:34px;border-radius:50%;background:hsl(var(--accent));color:hsl(var(--accent-foreground));display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.avatar.lg{width:56px;height:56px;font-size:18px}
.menu-btn{display:none}
#view{padding:22px 24px 40px;max-width:1500px;width:100%}

/* ===== Buttons / inputs ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;font-weight:700;font-size:13.5px;border:1px solid transparent;white-space:nowrap}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:8px}
.btn.lg{height:48px;padding:0 22px;font-size:15px;border-radius:12px}
.btn-p{background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
.btn-p:hover{filter:brightness(1.12)}
.btn-a{background:hsl(var(--brand));color:#fff}
.dark .btn-a{color:hsl(224 30% 10%)}
.btn-a:hover{filter:brightness(1.08)}
.btn-o{border-color:hsl(var(--input));background:hsl(var(--card))}
.btn-o:hover{background:hsl(var(--muted))}
.btn-g:hover{background:hsl(var(--muted))}
.btn-d{background:hsl(var(--destructive));color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-weight:700;font-size:13px}
.hint{font-size:12.5px;color:hsl(var(--muted-foreground))}
.err{font-size:12.5px;color:hsl(var(--destructive));font-weight:600;display:flex;gap:6px;align-items:center}
.inp{height:42px;border:1px solid hsl(var(--input));border-radius:10px;padding:0 12px;background:hsl(var(--card));width:100%}
.inp:focus{outline:2px solid hsl(var(--ring));outline-offset:1px;border-color:transparent}
.inp.bad{border-color:hsl(var(--destructive))}
.money-in{display:flex;align-items:center;border:1px solid hsl(var(--input));border-radius:12px;background:hsl(var(--card));height:62px;padding:0 16px;gap:10px}
.money-in:focus-within{outline:2px solid hsl(var(--ring));outline-offset:1px;border-color:transparent}
.money-in.bad{border-color:hsl(var(--destructive))}
.money-in span{font-weight:700;color:hsl(var(--muted-foreground));font-size:18px}
.money-in input{border:0;background:none;outline:0;font-size:28px;font-weight:800;width:100%;text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:32px;padding:0 13px;border-radius:999px;border:1px solid hsl(var(--input));background:hsl(var(--card));font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.chip:hover{background:hsl(var(--muted))}
.chip[aria-pressed=true]{background:hsl(var(--primary));color:hsl(var(--primary-foreground));border-color:transparent}
.chip b{font-weight:800;opacity:.75}
.seg{display:inline-flex;background:hsl(var(--muted));border-radius:11px;padding:3px}
.seg button{padding:7px 16px;border-radius:8px;font-weight:700;font-size:13.5px;color:hsl(var(--muted-foreground))}
.seg button[aria-selected=true]{background:hsl(var(--card));color:hsl(var(--foreground));box-shadow:0 1px 2px hsl(var(--foreground)/.12)}

/* ===== Cards, badges ===== */
.card{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:16px;padding:18px}
.card h2,.card h3{font-size:15px;font-weight:800;letter-spacing:-.005em}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:700;background:hsl(var(--muted));white-space:nowrap}
.badge::before{content:'';width:7px;height:7px;background:currentColor;border-radius:50%}
.b-ok{background:hsl(var(--success)/.13);color:hsl(var(--success))}
.b-warn{background:hsl(var(--warning)/.15);color:hsl(var(--warning))}
.b-warn::before{border-radius:1px;transform:rotate(45deg)}
.b-bad{background:hsl(var(--destructive)/.13);color:hsl(var(--destructive))}
.b-bad::before{border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%);width:8px;height:8px}
.b-info{background:hsl(var(--info)/.13);color:hsl(var(--info))}
.b-info::before{border-radius:1px}
.gl{border-bottom:1.5px dotted currentColor;position:relative;cursor:help}
.gl-pop{display:none;position:absolute;left:0;top:calc(100% + 6px);width:250px;background:hsl(var(--foreground));color:hsl(var(--background));padding:10px 12px;border-radius:10px;font-size:12.5px;font-weight:500;line-height:1.4;z-index:60;text-align:left;white-space:normal}
.gl:hover .gl-pop,.gl:focus .gl-pop,.gl:focus-within .gl-pop{display:block}

/* ===== Page header ===== */
.crumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:hsl(var(--muted-foreground));font-weight:600;margin-bottom:6px}
.crumb .ic{width:13px;height:13px}
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.ph p{color:hsl(var(--muted-foreground));margin-top:3px}

/* ===== Dashboard ===== */
.dash{display:grid;grid-template-columns:5fr 7fr;gap:14px}
.hero{background:hsl(var(--hero));border:1px solid hsl(var(--border));color:hsl(var(--hero-foreground));border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:6px}
.hero h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
.hero .sub{color:hsl(var(--hero-muted));font-size:13px;margin-bottom:8px}
.todo{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-top:1px solid hsl(var(--hero-line))}
.todo:first-of-type{border-top:0}
.todo .n{width:44px;height:44px;border-radius:12px;background:hsl(var(--accent));color:hsl(var(--accent-foreground));display:grid;place-items:center;font-weight:800;font-size:18px}
.todo .n.soft{background:hsl(var(--hero-foreground)/.12);color:hsl(var(--hero-foreground))}
.todo b{display:block;font-size:14px}
.todo small{color:hsl(var(--hero-muted));font-size:12.5px}
.hero .btn-h{height:34px;padding:0 14px;border-radius:9px;background:hsl(var(--accent));color:hsl(var(--accent-foreground));font-weight:700;font-size:13px}
.hero .btn-h:hover{background:hsl(var(--brand));color:#fff}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kpi{padding:15px 17px}
.kpi .t{font-size:13px;font-weight:600;color:hsl(var(--muted-foreground))}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.kpi .d{font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.col{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:7fr 5fr;gap:14px;margin-top:14px}
.stack{display:flex;height:34px;border-radius:9px;overflow:hidden;gap:3px;margin:12px 0 14px}
.stack i{display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:#fff;min-width:4px}
.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.legend div{font-size:12.5px;border-left:3px solid;padding-left:8px}
.legend b{display:block;font-size:15px}
.k1{background:hsl(150 55% 24%)}.k2{background:hsl(205 55% 34%)}.k3{background:hsl(34 85% 34%)}.k4{background:hsl(14 70% 40%)}.k5{background:hsl(350 60% 36%)}
.dark .k1{background:hsl(150 45% 36%)}.dark .k2{background:hsl(205 50% 44%)}.dark .k3{background:hsl(34 70% 42%)}.dark .k4{background:hsl(14 65% 48%)}.dark .k5{background:hsl(350 55% 48%)}
.legend .l1{border-color:hsl(150 55% 30%)}.legend .l2{border-color:hsl(205 55% 40%)}.legend .l3{border-color:hsl(34 85% 40%)}.legend .l4{border-color:hsl(14 70% 46%)}.legend .l5{border-color:hsl(350 60% 42%)}
.trx{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid hsl(var(--border))}
.trx:first-of-type{border-top:0}
.trx .tag{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:hsl(var(--muted))}
svg.chart text{font-family:inherit;font-size:11.5px;fill:hsl(var(--muted-foreground));font-weight:600}
svg.chart .lbl-a{fill:hsl(var(--chart-1));font-weight:800;font-size:12px}
svg.chart .lbl-b{fill:hsl(var(--chart-2));font-weight:800;font-size:12px}
details.alt{margin-top:6px;font-size:12.5px}
details.alt summary{cursor:pointer;color:hsl(var(--muted-foreground));font-weight:600}

/* ===== Table ===== */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tw{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:16px;overflow:clip}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{position:sticky;top:60px;z-index:2;background:hsl(var(--muted));text-align:left;font-size:12.5px;font-weight:700;color:hsl(var(--muted-foreground));padding:10px 14px;border-bottom:1px solid hsl(var(--border))}
.tbl td{padding:13px 14px;border-bottom:1px solid hsl(var(--border));vertical-align:middle}
.dense .tbl td{padding:7px 14px}
.tbl tr.r{cursor:pointer}
.tbl tr.r:hover td{background:hsl(var(--muted)/.55)}
.tbl tr:last-child td{border-bottom:0}
.who{display:flex;gap:11px;align-items:center;text-align:left}
.who b{display:block;font-weight:700}
.who small{color:hsl(var(--muted-foreground));font-size:12.5px}
.foot{display:flex;align-items:center;padding:10px 14px;gap:8px;font-size:12.5px;color:hsl(var(--muted-foreground));border-top:1px solid hsl(var(--border))}

/* ===== Drawer / modal / toast / popover ===== */
.scrim{position:fixed;inset:0;background:hsl(var(--foreground)/.38);z-index:50;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:hsl(var(--card));z-index:51;padding:22px;overflow-y:auto;border-left:1px solid hsl(var(--border));animation:slide .22s ease-out;box-shadow:-18px 0 40px hsl(var(--foreground)/.12)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100% - 28px));background:hsl(var(--card));border-radius:20px;padding:24px;z-index:52;box-shadow:0 24px 60px hsl(var(--foreground)/.25);animation:pop .16s ease-out;max-height:90vh;overflow:auto}
.modal h2{font-size:19px;font-weight:800;margin-bottom:4px}
.pal{position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:min(580px,calc(100% - 24px));background:hsl(var(--card));border-radius:18px;z-index:52;box-shadow:0 24px 60px hsl(var(--foreground)/.28);overflow:hidden;animation:pop .14s ease-out}
.pal input{width:100%;height:56px;border:0;border-bottom:1px solid hsl(var(--border));padding:0 20px;background:none;font-size:16px;outline:0;font-weight:600}
.pal ul{list-style:none;padding:8px;max-height:360px;overflow:auto}
.pal li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600}
.pal li[aria-selected=true]{background:hsl(var(--muted))}
.pal .grp{font-size:12px;color:hsl(var(--muted-foreground));padding:8px 12px 4px;font-weight:700;cursor:default}
.pal .grp:hover{background:none}
.pal-f{display:flex;gap:14px;padding:10px 16px;border-top:1px solid hsl(var(--border));font-size:12px;color:hsl(var(--muted-foreground))}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:340px;background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:16px;box-shadow:0 18px 44px hsl(var(--foreground)/.18);padding:8px;z-index:40;animation:pop .14s ease-out}
.pop .it{padding:10px;border-radius:10px}
.pop .it+.it{border-top:1px solid hsl(var(--border))}
.rel{position:relative}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:70}
.toast{background:hsl(var(--foreground));color:hsl(var(--background));padding:12px 16px;border-radius:12px;font-weight:600;display:flex;gap:10px;align-items:center;animation:pop .18s ease-out;max-width:360px}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}}
.pop,.toast{animation-name:fade}

/* ===== Forms: setor ===== */
.cols{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.step-h{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.step-h .no{width:28px;height:28px;border-radius:50%;background:hsl(var(--primary));color:hsl(var(--primary-foreground));display:grid;place-items:center;font-weight:800;font-size:13px}
.step-h h3{font-size:15px}
.res{border:1px solid hsl(var(--border));border-radius:12px;margin-top:8px;overflow:hidden}
.res button{display:flex;width:100%;padding:10px 12px;gap:11px;align-items:center;text-align:left}
.res button:hover,.res button[aria-selected=true]{background:hsl(var(--muted))}
.res button+button{border-top:1px solid hsl(var(--border))}
.sel{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:hsl(var(--muted)/.7)}
.sum{position:sticky;top:78px}
.sum dl{display:grid;grid-template-columns:auto 1fr;gap:9px 12px;margin:12px 0}
.sum dt{color:hsl(var(--muted-foreground))}
.sum dd{font-weight:700;text-align:right}
.sum .tot{border-top:1px dashed hsl(var(--input));padding-top:12px;margin-top:4px;display:flex;justify-content:space-between;align-items:baseline}
.sum .tot b{font-size:26px;font-weight:800;letter-spacing:-.02em}
.receipt{max-width:430px;margin:0 auto;background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:20px;padding:26px;position:relative}
.receipt .ok{width:56px;height:56px;border-radius:50%;background:hsl(var(--accent));color:hsl(var(--accent-foreground));display:grid;place-items:center;margin:0 auto 12px}
.receipt .ok .ic{width:28px;height:28px;stroke-width:2.4}
.receipt dl{display:grid;grid-template-columns:auto 1fr;gap:9px 12px;margin:18px 0;padding:16px 0;border-top:1px dashed hsl(var(--input));border-bottom:1px dashed hsl(var(--input))}
.receipt dt{color:hsl(var(--muted-foreground))}
.receipt dd{text-align:right;font-weight:700}

/* ===== Stepper ===== */
.stepper{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:9px;padding:8px 14px 8px 8px;border-radius:999px;border:1px solid hsl(var(--border));background:hsl(var(--card));font-weight:700;font-size:13px;color:hsl(var(--muted-foreground))}
.stp i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;background:hsl(var(--muted))}
.stp.on{color:hsl(var(--foreground));border-color:hsl(var(--primary));border-width:1.5px}
.stp.on i{background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
.stp.done i{background:hsl(var(--success));color:#fff}
.stp.done{color:hsl(var(--foreground))}
.pick{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid hsl(var(--border));border-radius:12px;width:100%;text-align:left;margin-bottom:8px;background:hsl(var(--card))}
.pick[aria-checked=true]{border-color:hsl(var(--primary));outline:1.5px solid hsl(var(--primary))}
.pick:hover{background:hsl(var(--muted)/.6)}
.sticky-f{position:sticky;bottom:0;display:flex;gap:10px;padding:14px 0 0;margin-top:18px;border-top:1px solid hsl(var(--border));background:linear-gradient(transparent,hsl(var(--card)) 14px)}
.sched td,.sched th{padding:8px 10px;font-size:13px}
.sched th{position:static}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat3>div{background:hsl(var(--muted)/.7);border-radius:12px;padding:12px 14px}
.stat3 small{display:block;color:hsl(var(--muted-foreground));font-weight:600;font-size:12.5px}
.stat3 b{font-size:18px;font-weight:800;letter-spacing:-.01em}

/* ===== Locked / empty ===== */
.locked{position:relative;overflow:hidden;border-radius:20px;border:1px solid hsl(var(--border));background:hsl(var(--card));min-height:430px}
.locked .ghost{position:absolute;inset:0;padding:22px;filter:blur(5px);opacity:.55;pointer-events:none}
.locked .ghost i{display:block;height:46px;border-radius:12px;background:hsl(var(--muted));margin-bottom:10px}
.locked .panel{position:relative;max-width:520px;margin:54px auto;background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:20px;padding:28px;box-shadow:0 20px 50px hsl(var(--foreground)/.14)}
.lockic{width:48px;height:48px;border-radius:14px;background:hsl(var(--accent));color:hsl(var(--accent-foreground));display:grid;place-items:center;margin-bottom:14px}
.empty{text-align:center;padding:60px 20px;max-width:440px;margin:30px auto}
.empty .lockic{margin:0 auto 14px;background:hsl(var(--muted));color:hsl(var(--foreground))}
.q{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:12px 0;border-top:1px solid hsl(var(--border))}
.q:first-of-type{border-top:0}
.q .meter{grid-column:1/-1;margin-top:0}
.inv{display:grid;grid-template-columns:1fr auto auto auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid hsl(var(--border))}
.inv:first-of-type{border-top:0}

/* ===== POS phone ===== */
.posw{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:start}
.phone{width:390px;height:clamp(640px,calc(100vh - 150px),790px);border-radius:44px;border:9px solid hsl(var(--foreground));background:hsl(var(--background));overflow:hidden;display:flex;flex-direction:column;position:relative;flex:none}
.phone .ph-top{padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px}
.phone .grid{flex:1;overflow:auto;padding:4px 16px 12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.prod{border:1px solid hsl(var(--border));background:hsl(var(--card));border-radius:16px;padding:12px;text-align:left;min-height:104px;display:flex;flex-direction:column;gap:4px;position:relative}
.prod:active{transform:scale(.98)}
.prod b{font-size:14px;line-height:1.25}
.prod .pr{margin-top:auto;font-weight:800;font-size:15px}
.prod .q-b{position:absolute;top:8px;right:8px;min-width:28px;height:28px;border-radius:14px;background:hsl(var(--primary));color:hsl(var(--primary-foreground));font-weight:800;display:grid;place-items:center;font-size:13px;padding:0 7px}
.paybar{padding:12px 16px 18px;border-top:1px solid hsl(var(--border));background:hsl(var(--card));display:flex;flex-direction:column;gap:10px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:hsl(var(--card));border-radius:24px 24px 0 0;padding:20px 18px 24px;box-shadow:0 -14px 40px hsl(var(--foreground)/.2);z-index:5}
.notes li{margin:0 0 12px 18px;line-height:1.45}
.notes h3{margin-bottom:10px}

/* ===== Login ===== */
#login{display:none;min-height:100vh;grid-template-columns:minmax(380px,520px) 1fr}
#login.on{display:grid}
.lg-l{padding:48px clamp(24px,6vw,72px);display:flex;flex-direction:column;justify-content:center;gap:18px}
.lg-r{background:hsl(var(--muted));color:hsl(var(--foreground));padding:56px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.lg-r h2{font-size:clamp(28px,3.4vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1.1;max-width:14ch;position:relative}
.lg-r p{color:hsl(var(--hero-muted));max-width:38ch;margin-top:14px;position:relative}
.rings{position:absolute;right:-90px;top:-70px;width:520px;height:520px;opacity:.9}
.dark #login .lg-r{background:hsl(var(--muted))}

/* ===== Responsive ===== */
@media(max-width:1180px){.cols{grid-template-columns:1fr}.sum{position:static}.dash,.two{grid-template-columns:1fr}.posw{grid-template-columns:1fr;justify-items:center}}
@media(max-width:900px){
  #app,#app.rail{grid-template-columns:1fr}
  .sb{position:fixed;left:0;top:0;width:272px;transform:translateX(-102%)}
  #app.rail .nav span,#app.rail .sb-g,#app.rail .brand span,#app.rail .tenant,#app.rail .nav .lk{display:revert}
  .sb.open{transform:none;box-shadow:20px 0 50px hsl(var(--foreground)/.25)}
  .menu-btn{display:grid}
  .top{padding:0 14px}#view{padding:16px 14px 90px}
  .hide-m{display:none!important}
  #login.on{grid-template-columns:1fr}.lg-r{display:none}
  .legend{grid-template-columns:repeat(3,1fr)}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block}
  .tbl tr{padding:12px 14px;border-bottom:1px solid hsl(var(--border));display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tbl td{padding:0!important;border:0}
  .tbl td:first-child{grid-column:1/-1}
  .tbl td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:hsl(var(--muted-foreground));font-weight:600}
  .right{text-align:left}
  .stat3{grid-template-columns:1fr}
  .inv{grid-template-columns:1fr auto}
}
@media(max-width:520px){.phone{width:100%;height:auto;min-height:720px;border-width:0;border-radius:0}.kpis{grid-template-columns:1fr}.ph h1{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body *{visibility:hidden}
  .receipt,.receipt *{visibility:visible}
  .receipt{position:absolute;left:0;top:0;border:0;max-width:none;width:100%}
  .no-print{display:none!important}
}
</style>
</head>
<body>

<div id="login"></div>

<div id="app">
  <aside class="sb" id="sb" aria-label="Navigasi utama"></aside>
  <div class="main">
    <header class="top">
      <button class="iconbtn menu-btn" data-a="menu" aria-label="Buka menu">__MENU__</button>
      <button class="iconbtn hide-m" data-a="rail" aria-label="Ciutkan atau perluas menu samping" title="Ciutkan menu">__PANEL__</button>
      <button class="search" data-a="pal" aria-label="Cari halaman atau anggota">__SEARCH__<span>Cari anggota, halaman, atau aksi</span><span class="sp"></span><kbd class="hide-m">Ctrl K</kbd></button>
      <span class="sp"></span>
      <div class="rel hide-m">
        <button class="btn btn-o" data-a="unit" aria-haspopup="true"><span id="unit-l">Semua unit</span>__CHEVD__</button>
        <div id="unit-pop"></div>
      </div>
      <button class="btn btn-a" data-a="go" data-v="setor">__PLUS__<span class="hide-m">Setor simpanan</span><span class="sr">Setor simpanan</span></button>
      <div class="rel">
        <button class="iconbtn" data-a="bell" aria-label="Notifikasi, 4 baru" aria-haspopup="true">__BELL__<span class="dot">4</span></button>
        <div id="bell-pop"></div>
      </div>
      <button class="iconbtn" data-a="theme" aria-label="Ganti tema terang atau gelap" id="theme-b"></button>
      <div class="rel">
        <button class="avatar" data-a="user" aria-label="Menu pengguna" aria-haspopup="true">RT</button>
        <div id="user-pop"></div>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="layer"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
/* ============ Icons (Lucide-style, 1.75 stroke) ============ */
const ICONS={
dashboard:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
wallet:'<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
banknote:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>',
cart:'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>',
book:'<path d="M12 7v14M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8"/>',
sliders:'<path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
plus:'<path d="M5 12h14M12 5v14"/>',
minus:'<path d="M5 12h14"/>',
chevR:'<path d="m9 18 6-6-6-6"/>',
chevD:'<path d="m6 9 6 6 6-6"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
check:'<path d="M20 6 9 17l-5-5"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',
printer:'<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98M15.41 6.51l-6.82 3.98"/>',
panel:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>',
alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/>',
store:'<path d="m2 7 2-4h16l2 4"/><path d="M4 7v13h16V7"/><path d="M2 7a3.33 3.33 0 0 0 5.33 0 3.33 3.33 0 0 0 5.34 0 3.33 3.33 0 0 0 5.33 0A3.33 3.33 0 0 0 22 7"/><path d="M9 20v-6h6v6"/>',
card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
trend:'<path d="M22 7 13.5 15.5l-5-5L2 17"/><path d="M16 7h6v6"/>',
menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/>',
send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>'
};
const I=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
document.body.innerHTML=document.body.innerHTML
  .replace('__MENU__',I('menu')).replace('__PANEL__',I('panel')).replace('__SEARCH__',I('search'))
  .replace('__CHEVD__',I('chevD')).replace('__PLUS__',I('plus')).replace('__BELL__',I('bell'));

const LOGO=(s=30)=>`<svg class="logo" width="${s}" height="${s}" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="12" cy="16" r="8.5" stroke="hsl(var(--primary))" stroke-width="3"/><circle cx="20" cy="16" r="8.5" stroke="hsl(var(--brand))" stroke-width="3"/></svg>`;

/* ============ Data (contoh) ============ */
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const KOL={1:'Lancar',2:'Dalam perhatian',3:'Kurang lancar',4:'Diragukan',5:'Macet'};
const M=[
 {id:'AG-0142',n:'Budi Santoso',nik:'3174051203850012',u:'Simpan Pinjam',st:'Aktif',s:18450000,p:7500000,k:1,hp:'0812-5521-0042',j:'12 Mar 2019'},
 {id:'AG-0087',n:'Siti Rahayu',nik:'3174064508900007',u:'Simpan Pinjam',st:'Aktif',s:32100000,p:0,k:1,hp:'0813-2290-1187',j:'03 Jan 2018'},
 {id:'AG-0203',n:'Agus Wibowo',nik:'3175012907780031',u:'Simpan Pinjam',st:'Menunggak',s:6200000,p:12000000,k:3,hp:'0857-1130-9921',j:'21 Agu 2020'},
 {id:'AG-0311',n:'Dewi Lestari',nik:'3173026011920004',u:'Simpan Pinjam',st:'Menunggak',s:9800000,p:5000000,k:2,hp:'0821-7745-3306',j:'15 Feb 2022'},
 {id:'AG-0056',n:'Hendra Gunawan',nik:'3174031004750019',u:'Simpan Pinjam',st:'Aktif',s:27600000,p:15000000,k:1,hp:'0811-9908-2271',j:'09 Jun 2017'},
 {id:'AG-0398',n:'Rina Marlina',nik:'3171084102950022',u:'Simpan Pinjam',st:'Menunggu',s:0,p:0,k:1,hp:'0878-6612-0405',j:'Menunggu persetujuan'},
 {id:'AG-0129',n:'Joko Prasetyo',nik:'3175072205830015',u:'Simpan Pinjam',st:'Aktif',s:14250000,p:3000000,k:1,hp:'0819-3321-7710',j:'30 Nov 2019'},
 {id:'AG-0174',n:'Lilis Suryani',nik:'3174095712880028',u:'Simpan Pinjam',st:'Aktif',s:21900000,p:0,k:1,hp:'0852-4410-6638',j:'18 Apr 2021'}
];
const ini=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('');
const split=t=>{const pokok=Math.min(t,500000);const wajib=Math.round((t-pokok)*.4/50000)*50000;return{Pokok:pokok,Wajib:wajib,Sukarela:t-pokok-wajib}};
const stBadge=s=>({Aktif:'b-ok',Menunggak:'b-bad',Menunggu:'b-warn'}[s]||'');
const kolBadge=k=>`<span class="badge ${k===1?'b-ok':k===2?'b-info':'b-bad'}">KOL ${k} ${KOL[k]}</span>`;
const GL={KOL:'Kolektibilitas: tingkat kelancaran pembayaran angsuran. KOL 1 paling lancar, KOL 5 macet.',NPL:'Pinjaman bermasalah: porsi pinjaman dengan KOL 3, 4, dan 5 dari seluruh pinjaman beredar.',SHU:'Sisa hasil usaha: laba koperasi yang dibagikan kepada anggota di akhir tahun buku.'};
const gl=t=>`<span class="gl" tabindex="0">${t}<span class="gl-pop" role="tooltip">${GL[t]}</span></span>`;

/* ============ State ============ */
const S={view:'dashboard',arg:'',rail:false,drawer:null,filter:'Semua',dense:false,q:'',
 setor:{mode:'Setor',member:null,amount:0,jenis:'Sukarela',done:null,q:''},
 loan:{step:0,m:M[0],prod:'Produktif',plafon:10000000,tenor:12,bunga:1.2,ok:false},
 pos:{cart:{},cat:'Semua',pay:false},
 pal:{q:'',i:0},unit:'Semua unit'};

const NAV=[
 ['Harian',[['dashboard','Beranda','dashboard'],['setor','Setor dan tarik','wallet'],['pos','Kasir toko','cart']]],
 ['Anggota',[['anggota','Daftar anggota','users'],['pinjaman','Pinjaman baru','banknote'],['pasar','Koperasi Pasar','store',1]]],
 ['Keuangan',[['kosong:Jurnal dan Tutup Buku','Jurnal dan Tutup Buku','book']]],
 ['Laporan',[['kosong:Laporan keuangan','Laporan keuangan','file']]],
 ['Pengaturan',[['langganan','Langganan','card'],['kosong:Pengaturan koperasi','Pengaturan','sliders']]]
];
const $=(s,r=document)=>r.querySelector(s);
const cur=()=>S.view==='kosong'?'kosong:'+S.arg:S.view;

function renderSb(){
 $('#sb').innerHTML=`<div class="brand">${LOGO()}<span>SISKOP</span></div>`+
 NAV.map(([g,it])=>`<div class="sb-g">${g}</div>`+it.map(([k,l,ic,lock])=>`<button class="nav" data-a="go" data-v="${k}" ${cur()===k?'aria-current="page"':''} title="${l}">${I(ic)}<span>${l}</span>${lock?I('lock','lk'):''}</button>`).join('')).join('')+
 `<div class="tenant"><b>Koperasi Barokah</b><span class="muted">Paket Tumbuh</span><div class="row" style="margin-top:8px;font-weight:700"><span>Anggota</span><span class="sp"></span><span class="num">180/200</span></div><div class="meter warn" role="meter" aria-valuenow="180" aria-valuemax="200" aria-label="Kuota anggota"><i style="width:90%"></i></div></div>`;
}

/* ============ Helpers ============ */
const crumb=a=>`<nav class="crumb" aria-label="Breadcrumb">${a.map((x,i)=>(i?I('chevR'):'')+`<span>${x}</span>`).join('')}</nav>`;
const ph=(c,t,d,act='')=>`<div class="ph"><div>${crumb(c)}<h1>${t}</h1>${d?`<p>${d}</p>`:''}</div><span class="sp"></span><div class="row">${act}</div></div>`;
function toast(m,i='check'){const t=document.createElement('div');t.className='toast';t.innerHTML=I(i)+`<span>${m}</span>`;$('#toasts').append(t);setTimeout(()=>t.remove(),3200)}
function openLayer(h){$('#layer').innerHTML=h}
function closeLayer(){$('#layer').innerHTML='';S.drawer=null}

/* ============ Views ============ */
function chart(){
 const W=560,H=190,pl=44,pr=84,pt=14,pb=26,mo=['Mei','Jun','Jul','Agu','Sep','Okt'];
 const a=[1.82,1.9,1.98,2.05,2.12,2.18],b=[1.31,1.36,1.42,1.46,1.5,1.53],mn=1.2,mx=2.4;
 const x=i=>pl+i*(W-pl-pr)/5,y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
 const pts=s=>s.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
 const grid=[1.2,1.6,2.0,2.4].map(v=>`<line x1="${pl}" x2="${W-pr+10}" y1="${y(v)}" y2="${y(v)}" stroke="hsl(var(--border))"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${String(v.toFixed(1)).replace('.',',')} M</text>`).join('');
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Tren simpanan dan pinjaman beredar, Mei sampai Oktober 2026. Simpanan naik dari 1,82 ke 2,18 miliar rupiah. Pinjaman naik dari 1,31 ke 1,53 miliar rupiah.">${grid}
 ${mo.map((m,i)=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${m}</text>`).join('')}
 <polyline points="${pts(a)}" fill="none" stroke="hsl(var(--chart-1))" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
 <polyline points="${pts(b)}" fill="none" stroke="hsl(var(--chart-2))" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/>

 if(!['bell','user','unit','approve','reject'].includes(a)&&!t.closest('.pop'))closePops();
 switch(a){

  case 'loan-m':S.loan={...S.loan,step:0,m:M.find(x=>x.id===v),ok:false};go('pinjaman');break;

  case 'print':window.print();break;

document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='amt'){const n=Number(t.value.replace(/\D/g,''))||0;S.setor.amount=n;t.value=n?n.toLocaleString('id-ID'):'';const er=setorErr();$('#mi').classList.toggle('bad',!!er);$('#amt-e').innerHTML=er?`<div class="err">${I('alert')}${er}</div>`:'';$('#sum').innerHTML=sumHtml()}
 if(t.id==='mpick'){S.setor.q=t.value;const q=t.value.toLowerCase();const r=M.filter(m=>m.st!=='Menunggu'&&(!q||(m.n+m.id+m.nik).toLowerCase().includes(q))).slice(0,4);$('#mres').innerHTML=r.map(m=>`<button role="option" data-a="pick-m" data-v="${m.id}"><span class="avatar">${ini(m.n)}</span><div><b>${m.n}</b><div class="muted num" style="font-size:12.5px">${m.id}, Simpanan ${rp(m.s)}</div></div></button>`).join('')||'<div class="hint" style="padding:12px">Anggota tidak ditemukan.</div>'}
 if(t.id==='mq'){S.q=t.value;$('#rows').innerHTML=rowsHtml();$('#cnt').textContent=filtered().length}
 if(t.id==='plaf'){const n=Number(t.value.replace(/\D/g,''))||0;S.loan.plafon=n;t.value=n?n.toLocaleString('id-ID'):'';$('#lsum').innerHTML=loanSum()}
 if(t.id==='pq'){S.pal.q=t.value;S.pal.i=0;const f=document.activeElement;renderPal()}
 if(t.id==='lok'){S.loan.ok=t.checked;$('#lsub').disabled=!t.checked}
});
document.addEventListener('change',e=>{if(e.target.id==='lok'){S.loan.ok=e.target.checked;$('#lsub').disabled=!e.target.checked}});
document.addEventListener('submit',e=>{e.preventDefault();showApp(true);go('dashboard')});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();S.pal={q:'',i:0};renderPal();return}
 if(e.key==='Escape'){closeLayer();closePops();return}
 if($('.pal')){const n=palItems().filter(x=>!x.g);
  if(e.key==='ArrowDown'){e.preventDefault();S.pal.i=(S.pal.i+1)%Math.max(n.length,1);renderPal()}
  if(e.key==='ArrowUp'){e.preventDefault();S.pal.i=(S.pal.i-1+n.length)%Math.max(n.length,1);renderPal()}
  if(e.key==='Enter'&&n[S.pal.i]){e.preventDefault();palRun(n[S.pal.i].v)}}
 if(e.key==='Enter'&&e.target.closest?.('tr.r')){e.target.click()}
});
const H=location.hash.slice(1).split(',');
if(H.includes('dark'))document.documentElement.classList.add('dark');
if(H.includes('login')){renderLogin();showApp(false)}
else{const h=H.find(x=>VIEWS[x]);if(h)S.view=h}
render();
</script>
</body>
</html>
